- scope:
    path: "_posts/Prompts"
    type: "posts"
  values:
    permalink: "/prompts/:slug/"
- scope:
    path: ""
    type: tools
  values:
    layout: tool
    no_toc: true

# =============================================================================
# AUTHOR REGISTRY
# =============================================================================
# Define all authors here. Reference them in post front matter by their key.
#
# Single author (legacy format - still fully supported):
#   author: tschopp
#
# Multiple authors (new array format):
#   authors:
#     - tschopp
#     - copilot
#
# You can also mix registry keys with inline definitions:
#   authors:
#     - tschopp
#     - name: Guest Contributor
#       url: https://example.com
#
# Use {% assign author = site.authors[page.author] %} for single-author lookup
# Or use {% include utility/resolve-authors.html page=page %} for multi-author
# =============================================================================
authors:
  tschopp: &primary_author
    name: *profile_name
    url: *profile_url
    uri: *profile_url
    avatar: *profile_avatar
    givenname: *profile_givenname
    familyname: *profile_familyname
    othernames: *profile_othernames
    biography: *profile_biography
    email: *profile_email
    phonenumber: *profile_phonenumber
    keybaseio_username: *profile_keybaseio_username
    twitter_username: *profile_twitter_username
    twitter: *profile_twitter_username
    github_username: *profile_github_username
    linkedin_username: *profile_linkedin_username
    facebook_username: *profile_facebook_username
    google_username: *profile_google_username
    youtube_username: *profile_youtube_username
    pinterest_username: *profile_pinterest_username
    reddit_username: *profile_reddit_username
    instagram_username: *profile_instagram_username
    quora_username: *profile_quora_username
    indiewebcamp_username: *profile_indiewebcamp_username
    mastodon_username: *profile_mastodon_username
    mastodon_user_id: *profile_mastodon_user_id
    threads_username: *profile_threads_username
    same_as: *profile_same_as
    knows_about: *profile_knows_about
    works_for: *profile_works_for

  copilot:
    name: GitHub Copilot
    url: https://github.com/features/copilot
    avatar: https://github.githubassets.com/images/modules/site/copilot/copilot.png

# Compatibility alias for legacy templates/includes that still read `site.author`.
author: *primary_author

