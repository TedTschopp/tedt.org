include:
- ".well-known"
- "_pages"

# Exclude editor backup copies of posts (e.g., *.md.bak) so they don't generate duplicate URLs
exclude:
- _apps/**
- "**/*.bak"
# Photoshop masters stay in Git. Pages serves the exported images.
- "**/*.psd"
- "**/*.PSD"
# Exclude embedded Python virtual env inside data (never needed for site build)
- _data/Swiss-Folklore-Work-in-Progress/myenv/**
# Exclude large in-progress data (kept for future development; do not load or process)
- _data-to-be-developed/**

# Exclude temp worktrees (may contain non-Jekyll sources like Bootstrap's site)
- tmp/**

# Exclude CI/runtime artifacts and test sources from the public Pages output.
- Logs/**
- tests/**
- test-results/**
- .allure/**
- reports/allure/allure-results/**
# This only keeps the public operational ledger out of rendered Pages output.
# The Git branch remains readable; never store credentials or subscriber data here.
- cache/substack-sync.json
- cache/mastodon-ledger.json
- cache/webmention-outbox.json
- cache/webmention-incoming.json
- bootstrap-5.3.2.tgz

