# Mastodon Settings for Comments
# This is intentionally separate from `profile.social.mastodon_username`.
# Comments render against the account that hosts the syndicated post thread.

mastodon_comments:
  host: tschopp.net
  username: Ted

collections:
  GammaWorld:
    output: true
    permalink: /:collection/:title
  # Slides are stored as regular posts under `_posts/Slides/` (see README: Slide Deck Front Matter).
  # Former `slides` collection removed for simplification; templates retain graceful fallback logic.
  tools:
    output: true
    permalink: /tools/:name/

# Defaults for different types of posts
