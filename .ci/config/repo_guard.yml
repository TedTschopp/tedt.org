max_warn_kb: 2048
max_fail_kb: 5120
blocked_paths:
- vendor/bundle
- vendor/ruby
blocked_extensions:
- .psd
- .ai
blocked_file_patterns:
- pattern: '(^|/)[^/]+\.bak(-[0-9]{8})?$'
  description: "backup/shadow files; use Git history instead"
- pattern: '(^|/)[^/]+ backup\.[^/]+$'
  description: "backup/shadow files; use Git history instead"
- pattern: '(^|/)[^/]+-old\.[^/]+$'
  description: "backup/shadow files; use Git history instead"
- pattern: '^[^/]+\.(py|rb|sh)$'
  description: "top-level utility scripts; use _code/ or scripts/"
largest_files_report_count: 10
warning_report_count: 25
allowlist_file: .ci/allowed-large-files.txt
