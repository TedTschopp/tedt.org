# Curated enterprise AI and enterprise architecture topic clusters.
#
# Membership uses each post's Jekyll `relative_path` instead of a hard-coded URL.
# That lets layouts resolve the current canonical URL when permalinks evolve.
# Keep each post in the section that best explains why it belongs in the cluster.

enterprise-ai-strategy:
  order: 10
  title: Enterprise AI Strategy and Operating Models
  short_title: Enterprise AI Strategy
  permalink: /topics/enterprise-ai-strategy/
  description: A practical guide to AI adoption, operating models, leadership, workforce change, and the systems required to turn experiments into durable enterprise value.
  intro: Enterprise AI becomes useful when leadership, governance, platforms, delivery teams, and day-to-day work reinforce one another. These essays move from executive intent to operating mechanisms and measurable adoption.
  sections:
    - title: Start with the operating model
      description: Frame AI as an enterprise capability rather than a collection of disconnected tools.
      posts:
