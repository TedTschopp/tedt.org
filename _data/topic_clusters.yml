        - path: _posts/AI/2026-04-12-What-IT-Looks-Like-in-an-Enterprise-Where-AI-Is-Assumed.md
        - path: _posts/AI/2026-01-04-Make-AI-Boring.md
    - title: Align people, work, and leadership
      description: Connect adoption to organizational design, judgment, learning, and changes in how work flows.
      posts:
        - path: _posts/AI/2026-05-24-AI-Is-a-People-Change.md
        - path: _posts/AI/2026-04-18-When-Output-Becomes-Abundant.md
        - path: _posts/Blog Posts/2025-05-18-Beyond-the-Boundries-Leading-in-a-Post-AI-Era.md
    - title: Translate strategy into value
      description: Use repeatable frameworks and economic reasoning to choose where AI belongs and how it should scale.
      posts:
        - path: _posts/AI/2025-11-13-Winning-the-Intelligence-Inversion.md
        - path: _posts/Blog Posts/2025-05-25-Details-on-the-WINs-Network.md
        - path: _posts/Blog Posts/2025-01-05-What-AI-in-2024-Means-for-Us-in-2025.md

