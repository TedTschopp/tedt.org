        applyCapexHighlight();
      });

  capexLegend.append(&quot;span&quot;)
    .attr(&quot;class&quot;, &quot;capex-swatch&quot;)
    .attr(&quot;aria-hidden&quot;, &quot;true&quot;)
    .style(&quot;--company-color&quot;, function (company) { return company.color; });

  capexLegend.append(&quot;span&quot;)
    .text(function (company) { return company.label; });

  function formatCapex(value) {
    return &quot;$&quot; + d3.format(&quot;.1f&quot;)(value) + &quot;B&quot;;
  }

  function capexQuarterText(row) {
    return row.quarter + &quot; total &quot; + formatCapex(row.total) + &quot; · &quot; +
      capexLegendOrder.map(function (key) {
        return capexCompanies.get(key).label + &quot; &quot; + formatCapex(row[key]);
      }).join(&quot; · &quot;);
  }

  function showCapexLatest(companyKey) {
    const latest = capexData[capexData.length - 1];
    capexDetail.textContent = latest.quarter + &quot; · &quot; + capexCompanies.get(companyKey).label + &quot; &quot; + formatCapex(latest[companyKey]);
  }

  function restoreCapexDetail() {
    if (capexPinnedCompanies.size === 1) {
      showCapexLatest(Array.from(capexPinnedCompanies)[0]);
      return;
    }
    capexDetail.textContent = capexQuarterText(capexData[capexData.length - 1]);
  }

  function activeCapexCompanies() {
    if (capexPreviewCompany) return new Set([capexPreviewCompany]);
    return capexPinnedCompanies.size ? capexPinnedCompanies : null;
  }

  function applyCapexHighlight() {
    const active = activeCapexCompanies();
    capexSvg.selectAll(&quot;.capex-bar&quot;)
      .attr(&quot;opacity&quot;, function (point) {
        return !active || active.has(point.company) ? 1 : 0.14;
      });
    capexSvg.selectAll(&quot;.capex-segment-label&quot;)
      .attr(&quot;opacity&quot;, function (point) {
        return !active || active.has(point.company) ? 1 : 0.14;
      });
  }

  function setCapexTooltipContent(row) {
    const heading = document.createElement(&quot;strong&quot;);
    heading.textContent = row.quarter;
    const total = document.createElement(&quot;div&quot;);
    total.textContent = &quot;Total &quot; + formatCapex(row.total);
    const lines = capexLegendOrder.map(function (key) {
      const line = document.createElement(&quot;div&quot;);
      line.textContent = capexCompanies.get(key).label + &quot; · &quot; + formatCapex(row[key]);
      return line;
    });
    capexTooltip.replaceChildren(heading, total);
    lines.forEach(function (line) { capexTooltip.appendChild(line); });
  }

  function showCapexTooltip(mark, row) {
    setCapexTooltipContent(row);
    capexTooltip.style.visibility = &quot;hidden&quot;;
    capexTooltip.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
    const markRect = mark.getBoundingClientRect();
    const plotRect = capexPlot.getBoundingClientRect();
    const anchorX = markRect.left - plotRect.left + markRect.width / 2;
    const anchorY = markRect.top - plotRect.top;
    capexTooltip.style.left = &quot;0px&quot;;
    capexTooltip.style.top = &quot;0px&quot;;
    const box = capexTooltip.getBoundingClientRect();
    const left = Math.max(0, Math.min(plotRect.width - box.width, anchorX - box.width / 2));
    const top = Math.max(0, anchorY - box.height - 10);
    capexTooltip.style.left = left + &quot;px&quot;;
    capexTooltip.style.top = top + &quot;px&quot;;
    capexTooltip.style.visibility = &quot;visible&quot;;
    capexDetail.textContent = capexQuarterText(row);
  }

  function hideCapexTooltip() {
    capexTooltip.style.visibility = &quot;hidden&quot;;
    capexTooltip.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
    restoreCapexDetail();
  }

  function renderCapex() {
    const width = Math.max(300, Math.round(capexPlot.getBoundingClientRect().width || 736));
    const height = width &lt; 480 ? 420 : 440;
    const margin = { top: 30, right: width &lt; 480 ? 20 : 10, bottom: width &lt; 480 ? 80 : 92, left: width &lt; 480 ? 26 : 32 };
    const x = d3.scaleBand()
      .domain(capexData.map(function (row) { return row.quarter; }))
      .range([margin.left, width - margin.right])
      .paddingInner(0.18)
      .paddingOuter(0.05);
    const y = d3.scaleLinear()
      .domain([0, 160])
      .range([height - margin.bottom, margin.top]);
    const stacked = d3.stack().keys(capexStackOrder)(capexData);

    capexSvg.attr(&quot;viewBox&quot;, &quot;0 0 &quot; + width + &quot; &quot; + height)
      .attr(&quot;height&quot;, height);
    capexSvg.selectAll(&quot;*&quot;).remove();

    capexSvg.append(&quot;title&quot;)
      .attr(&quot;id&quot;, &quot;capex-svg-title&quot;)
      .text(&quot;Capital expenditure by major technology companies over time&quot;);
    capexSvg.append(&quot;desc&quot;)
      .attr(&quot;id&quot;, &quot;capex-svg-desc&quot;)
      .text(&quot;Stacked quarterly capital expenditure for Microsoft, Google, Meta, Amazon, Oracle, and Apple from Q1 2021 through Q1 2026, in billions of US dollars.&quot;);
    capexSvg.append(&quot;g&quot;)
      .attr(&quot;aria-hidden&quot;, &quot;true&quot;)
      .selectAll(&quot;line&quot;)
      .data([40, 80, 120, 160])
      .join(&quot;line&quot;)
        .attr(&quot;class&quot;, &quot;capex-gridline&quot;)
        .attr(&quot;x1&quot;, margin.left)
        .attr(&quot;x2&quot;, width - margin.right)
        .attr(&quot;y1&quot;, function (value) { return y(value); })
        .attr(&quot;y2&quot;, function (value) { return y(value); });

    const layers = capexSvg.append(&quot;g&quot;)
      .selectAll(&quot;g&quot;)
      .data(stacked)
      .join(&quot;g&quot;)
        .attr(&quot;fill&quot;, function (layer) { return capexCompanies.get(layer.key).color; });

    layers.selectAll(&quot;rect&quot;)
      .data(function (layer) {
        return layer.map(function (point) {
          return {
            company: layer.key,
            row: point.data,
            y0: point[0],
            y1: point[1]
          };
        });
      })
      .join(&quot;rect&quot;)
        .attr(&quot;class&quot;, &quot;capex-bar&quot;)
        .attr(&quot;x&quot;, function (point) { return x(point.row.quarter); })
        .attr(&quot;y&quot;, function (point) { return y(point.y1); })
        .attr(&quot;width&quot;, x.bandwidth())
        .attr(&quot;height&quot;, function (point) { return Math.max(0, y(point.y0) - y(point.y1)); });

    const segmentLabels = stacked.flatMap(function (layer) {
      return layer.map(function (point) {
        return {
          company: layer.key,
          row: point.data,
          y0: point[0],
          y1: point[1],
          pixelHeight: y(point[0]) - y(point[1])
        };
      });
    }).filter(function (point) {
      return x.bandwidth() &gt;= 18 &amp;&amp; point.pixelHeight &gt;= 18;
    });

    capexSvg.append(&quot;g&quot;)
      .attr(&quot;aria-hidden&quot;, &quot;true&quot;)
      .selectAll(&quot;text&quot;)
      .data(segmentLabels)
      .join(&quot;text&quot;)
        .attr(&quot;class&quot;, &quot;capex-segment-label text-small&quot;)
        .attr(&quot;x&quot;, function (point) { return x(point.row.quarter) + x.bandwidth() / 2; })
        .attr(&quot;y&quot;, function (point) { return y((point.y0 + point.y1) / 2); })
        .attr(&quot;dy&quot;, &quot;0.35em&quot;)
        .attr(&quot;text-anchor&quot;, &quot;middle&quot;)
        .text(function (point) { return &quot;$&quot; + Math.round(point.row[point.company]); });

    const totalStep = width &lt; 480 ? 4 : width &lt; 640 ? 2 : 1;
    const totals = capexData.filter(function (row, index) {
      return index % totalStep === 0 || index === capexData.length - 1;
    });

    capexSvg.append(&quot;g&quot;)
      .attr(&quot;aria-hidden&quot;, &quot;true&quot;)
      .selectAll(&quot;text&quot;)
      .data(totals)
      .join(&quot;text&quot;)
        .attr(&quot;class&quot;, &quot;capex-total-label text-small&quot;)
        .attr(&quot;x&quot;, function (row) { return x(row.quarter) + x.bandwidth() / 2; })
        .attr(&quot;y&quot;, function (row) { return Math.max(margin.top + 10, y(row.total) - 7); })
        .attr(&quot;text-anchor&quot;, &quot;middle&quot;)
        .text(function (row) { return &quot;$&quot; + Math.round(row.total); });

    const tickStep = width &lt; 480 ? 4 : width &lt; 640 ? 2 : 1;
    const tickQuarters = capexData
      .filter(function (row, index) { return index % tickStep === 0 || index === capexData.length - 1; })
      .map(function (row) { return row.quarter; });

    const capexAxis = capexSvg.append(&quot;g&quot;)
      .attr(&quot;class&quot;, &quot;capex-axis text-small&quot;)
      .attr(&quot;transform&quot;, &quot;translate(0,&quot; + (height - margin.bottom) + &quot;)&quot;)
      .call(
        d3.axisBottom(x)
          .tickValues(tickQuarters)
          .tickSize(0)
          .tickPadding(9)
      );

    capexAxis.selectAll(&quot;text&quot;)
      .attr(&quot;text-anchor&quot;, &quot;end&quot;)
      .attr(&quot;transform&quot;, &quot;rotate(-55)&quot;)
      .attr(&quot;dx&quot;, &quot;-0.55em&quot;)
      .attr(&quot;dy&quot;, &quot;0.15em&quot;);

    capexSvg.append(&quot;g&quot;)
      .selectAll(&quot;rect&quot;)
      .data(capexData)
      .join(&quot;rect&quot;)
        .attr(&quot;class&quot;, &quot;capex-hit&quot;)
        .attr(&quot;x&quot;, function (row) { return x(row.quarter); })
        .attr(&quot;y&quot;, margin.top)
        .attr(&quot;width&quot;, x.bandwidth())
        .attr(&quot;height&quot;, height - margin.bottom - margin.top)
        .attr(&quot;fill&quot;, &quot;transparent&quot;)
        .style(&quot;cursor&quot;, &quot;crosshair&quot;)
        .on(&quot;pointerenter&quot;, function (event, row) {
          showCapexTooltip(event.currentTarget, row);
        })
        .on(&quot;pointerleave&quot;, function () {
          hideCapexTooltip();
        })
        .on(&quot;pointerdown&quot;, function (event, row) {
          event.stopPropagation();
          showCapexTooltip(event.currentTarget, row);
        });

    applyCapexHighlight();
  }

  capexSection.addEventListener(&quot;keydown&quot;, function (event) {
    if (event.key === &quot;Escape&quot;) {
      capexPinnedCompanies.clear();
      capexPreviewCompany = null;
      capexLegend.attr(&quot;aria-pressed&quot;, &quot;false&quot;);
      hideCapexTooltip();
      applyCapexHighlight();
    }
  });

  capexSection.addEventListener(&quot;pointerdown&quot;, function (event) {
    if (!event.target.closest(&quot;.capex-hit&quot;) &amp;&amp; !event.target.closest(&quot;.capex-key&quot;)) {
      hideCapexTooltip();
    }
  });

  restoreCapexDetail();
  renderCapex();

  const capexResizeObserver = new ResizeObserver(function () {
    window.requestAnimationFrame(renderCapex);
  });
  capexResizeObserver.observe(capexPlot);
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
