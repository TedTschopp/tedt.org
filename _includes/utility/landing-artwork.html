<picture data-tedt-artwork>
  {% if include.artwork.dark %}
  <source data-tedt-dark type="image/webp" media="(prefers-color-scheme: dark)"
    srcset="{% for variant in include.artwork.dark.sources %}{{ variant.src | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
    sizes="{% if include.priority %}(max-width: 1184px) calc(100vw - 48px), 1136px{% else %}(max-width: 767px) calc(100vw - 48px), (max-width: 1023px) calc((100vw - 80px) / 2), 260px{% endif %}">
  {% endif %}
  <img class="img-fluid" src="{{ include.artwork.src | relative_url }}"
  srcset="{% for variant in include.artwork.sources %}{{ variant.src | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
  sizes="{% if include.priority %}(max-width: 1184px) calc(100vw - 48px), 1136px{% else %}(max-width: 767px) calc(100vw - 48px), (max-width: 1023px) calc((100vw - 80px) / 2), 260px{% endif %}"
  width="{{ include.artwork.width }}" height="{{ include.artwork.height }}"
  alt="{{ include.artwork.alt | escape }}"
  {% if include.priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %} decoding="async">
</picture>
