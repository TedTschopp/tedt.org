name: Feed to Mastodon

on:
  workflow_run:
    # Workflow-name filters are globs; escape the literal plus sign.
    workflows: ['Site Quality \+ Deploy']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Audit offline, reconcile public threads, or publish one queued item
        type: choice
        default: audit
        options: [audit, reconcile, publish]
      write:
        description: Persist verified mappings; publishing also requires both rollout switches
        type: boolean
        default: false
      archive_canary:
        description: Allow one manual archive item while automatic backfill stays paused
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mastodon-production-mutations
  cancel-in-progress: false

jobs:
  post-feed:
    if: >-
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/deploy.yml' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(mastodon):'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Validate mode and rollout switches
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'audit' }}
          REQUESTED_WRITE: ${{ inputs.write || false }}
          PUBLISH_ENABLED: ${{ vars.MASTODON_PUBLISH_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          write="$REQUESTED_WRITE"
          if [ "$EVENT_NAME" != 'workflow_dispatch' ]; then
            mode=reconcile
            write=true
            if [ "$PUBLISH_ENABLED" = true ]; then mode=publish; fi
          fi
          case "$mode" in audit|reconcile|publish) ;; *) exit 1 ;; esac
          case "$write" in true|false) ;; *) exit 1 ;; esac
          if [ "$mode" = audit ] && [ "$write" = true ]; then
            echo 'An offline audit cannot write verified mappings.' >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "write=$write" >> "$GITHUB_OUTPUT"

      - name: Require a successful deployment before publication
        id: deployed
        if: steps.inputs.outputs.mode == 'publish' && steps.inputs.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployed_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | first | .head_sha')
          if [ "$deployed_sha" != "$(git rev-parse HEAD)" ]; then
            echo 'Publication deferred until the current main commit is deployed.' >> "$GITHUB_STEP_SUMMARY"
            echo 'deferred=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run publication and recovery regression checks
        run: python3 -m unittest discover -s tests/mastodon -p 'test_*.py' -v

      - name: Audit, reconcile, or publish one item
        id: sync
        if: steps.deployed.outputs.deferred != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_PUBLISH_ENABLED: ${{ vars.MASTODON_PUBLISH_ENABLED || 'false' }}
          MASTODON_BACKFILL_ENABLED: ${{ vars.MASTODON_BACKFILL_ENABLED || 'false' }}
          SYNC_MODE: ${{ steps.inputs.outputs.mode }}
          SYNC_WRITE: ${{ steps.inputs.outputs.write }}
          ARCHIVE_CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_canary || false }}
        run: |
          set -euo pipefail
          mkdir -p tmp/mastodon
          args=("$SYNC_MODE" --github-state --report tmp/mastodon/report.json)
          if [ "$SYNC_WRITE" = true ]; then args+=(--write); fi
          if [ "$ARCHIVE_CANARY" = true ]; then args+=(--archive-canary); fi
          python3 _code/mastodon_sync.py "${args[@]}" | tee tmp/mastodon/run.json
          {
            echo '## Mastodon publication and recovery'
            echo '```json'
            cat tmp/mastodon/report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist verified website metadata
        id: metadata
        if: steps.sync.outcome == 'success' && steps.inputs.outputs.write == 'true'
        run: |
          set -euo pipefail
          git add -- cache/mastodon-ledger.json _data/mastodon_status.json _posts
          python3 - <<'PY'
          import re, subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          allowed = re.compile(r'^(cache/mastodon-ledger\.json|_data/mastodon_status\.json|_posts/.+\.md)$')
          if any(path and not allowed.fullmatch(path) for path in paths):
              raise SystemExit('Unexpected website mutation; refusing metadata commit')
          PY
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mastodon): sync publication state'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'Website metadata could not be pushed; the durable ledger retains the receipt. Reconcile before retrying.' >&2
          exit 1

      - name: Deploy updated discussion links and progress
        if: steps.metadata.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Preserve diagnostics and uncertain receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mastodon-recovery-${{ github.run_id }}
          path: tmp/mastodon/
          if-no-files-found: ignore
          retention-days: 30
