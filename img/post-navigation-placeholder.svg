<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="816" viewBox="0 0 1456 816" role="img" aria-labelledby="title desc">
  <title id="title">TedT.org article preview image</title>
  <desc id="desc">A generated local fallback image for post navigation cards when an article has no dedicated preview image.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.48" stop-color="#164e63"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#f8fafc" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1456" height="816" fill="url(#sky)"/>
  <rect width="1456" height="816" fill="url(#grid)"/>
  <rect width="1456" height="816" fill="url(#glow)"/>
  <g filter="url(#soft-shadow)">
    <rect x="348" y="198" width="760" height="420" rx="28" fill="#f8fafc" fill-opacity="0.10" stroke="#f8fafc" stroke-opacity="0.24" stroke-width="3"/>
    <path d="M420 520L608 342L734 464L836 382L1036 520H420Z" fill="#f8fafc" fill-opacity="0.18"/>
    <circle cx="912" cy="314" r="54" fill="#f59e0b" fill-opacity="0.72"/>
    <rect x="420" y="556" width="616" height="14" rx="7" fill="#f8fafc" fill-opacity="0.22"/>
  </g>
  <text x="728" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#f8fafc" font-weight="700">TedT.org</text>
  <text x="728" y="724" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#e2e8f0" fill-opacity="0.86">Article preview image</text>
</svg>